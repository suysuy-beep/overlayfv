nd:linear-gradient(110deg,#d36d98,#f1a7c5);border:0;color:#271822}.iconbtn{appearance:none;border:0;background:transparent;color:#aeacbc;cursor:pointer;font-size:20px;min-width:30px;height:36px;border-radius:10px}.iconbtn:hover{color:white;background:#30303e}.searcharea{padding:15px 18px 0;flex:none}.searchbox{display:flex;align-items:center;border:1px solid #46414d;background:#22232f;height:44px;border-radius:13px;padding:0 12px;gap:9px}.searchbox svg{opacity:.65;flex:none}.searchbox input{background:none;border:0;outline:0;flex:1;width:0;color:white;font:inherit;font-size:13px}.searchbox input::placeholder{color:#9996a8}.kbd{color:#928d9a;font-size:10px;border:1px solid #494450;border-radius:6px;padding:4px 5px}.tabs{display:flex;padding:14px 18px 10px;gap:4px;flex:none}.tab{flex:1;border:0;background:none;color:#c9c2ce;font-weight:650;min-width:0;padding:10px 3px;cursor:pointer;font-size:13px;border-radius:12px}.tab.current{background:linear-gradient(100deg,#e98fae,#ffc0c6);color:#221722;box-shadow:0 3px 18px #c6779659}.filters{display:flex;gap:7px;white-space:nowrap;overflow-x:auto;padding:0 18px 10px;scrollbar-width:none;flex:none}.filters::-webkit-scrollbar{display:none}.chip{border:1px solid #46434f;border-radius:9px;padding:7px 10px;background:#191923;color:#cfc6d3;cursor:pointer;font-size:11px}.chip.active{color:#ffd9e9;background:#513244;border-color:#e28cac;box-shadow:0 0 10px #e28cac24}.products{overflow-y:auto;overflow-x:hidden;padding:0 17px 12px;scrollbar-color:#6c556c transparent;scrollbar-width:thin;flex:1;min-height:110px}.product{display:flex;align-items:center;gap:11px;background:linear-gradient(100deg,#20232e,#1d1e29);border:1px solid #292d3a;border-radius:13px;min-height:77px;padding:7px;margin-bottom:8px}.product:hover{border-color:#58505c}.picture{display:grid;place-items:center;flex:none;width:62px;height:61px;border-radius:11px;background:linear-gradient(150deg,#373b45,#272932);overflow:hidden}.picture svg{width:48px;height:48px}.info{flex:1;min-width:0}.productname{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.price{color:var(--pink);font-size:12px;font-weight:800;margin-top:5px}.counter{display:flex;align-items:center;gap:6px}.counter button{border:0;border-radius:10px;background:#2a2d3a;color:#eef0f5;width:34px;height:36px;font-size:21px;cursor:pointer}.counter button.plus{background:linear-gradient(145deg,#87445f,#754058);color:#ffdeed}.counter button:hover{filter:brightness(1.18)}.count{font-size:13px;font-weight:600;width:22px;text-align:center;font-variant-numeric:tabular-nums}.empty{padding:35px;text-align:center;color:var(--soft);font-size:13px}
.budget{flex:none;margin:0 16px 14px;background:linear-gradient(155deg,#1e202c,#191923);border:1px solid #74536a;border-radius:15px;box-shadow:0 -10px 30px #06040b70;min-height:0}.budgethead{display:flex;align-items:center;width:100%;color:var(--ink);padding:13px 14px;border:0;background:transparent;cursor:pointer;text-align:left;gap:10px;font-size:14px;font-weight:800}.budgethead svg{color:var(--pink)}.budgethead .fill{flex:1}.budgethead .countpill{background:#593249;color:#ffcfdf;border-radius:20px;font-size:11px;padding:3px 7px}.caret{color:#e8abc7;transform:rotate(0);transition:transform .15s}.budget.closed .caret{transform:rotate(180deg)}.minitotal{display:none;color:#eea5c4;font-size:13px;font-weight:800}.budget.closed .minitotal{display:inline}.budgetbody{padding:0 13px 12px}.budget.closed .budgetbody{display:none}.sumline{display:flex;justify-content:space-between;margin-top:7px;font-size:12px;color:#c4bfcb}.discount{display:flex;gap:5px;margin-top:10px}.discount button{flex:1;background:#2b2d3a;border:1px solid #484353;color:#ddd2db;padding:9px 3px;font-size:11px;border-radius:9px;cursor:pointer}.discount button.on{background:#f0a2bf;color:#211724;border-color:#f0a2bf;font-weight:800}.total{border-top:1px solid #3b3b48;margin-top:10px;padding:10px 0 9px;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600}.total strong{font-size:28px;color:#ef96bc;font-variant-numeric:tabular-nums;letter-spacing:-.04em}.actions{display:flex;gap:8px}.actions button{flex:1;min-width:0;padding:11px 5px;font-size:12px;font-weight:700;border-radius:10px;cursor:pointer;border:1px solid #a36a86;background:transparent;color:#f5d6e7}.actions button.main{color:#281823;background:linear-gradient(110deg,#d36d98,#f1a7c5);border:0}.detailsummary{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.tinybtn{background:none;border:0;color:#c7abc0;font-size:11px;cursor:pointer;text-decoration:underline;padding:4px 0}.details{display:none;margin-top:8px}.details.visible{display:block}.details textarea{width:100%;height:86px;resize:vertical;border:1px solid #47414d;border-radius:9px;background:#171925;padding:10px;color:#eee;font:12px/1.5 ui-monospace,Consolas,monospace}.detailopts{display:flex;gap:8px;justify-content:space-between;align-items:center;font-size:11px;color:#aeabba}.detailopts label{display:flex;align-items:center;gap:5px;cursor:pointer}.detailopts input{accent-color:#e68db4}.toast{position:absolute;bottom:18px;left:50%;transform:translate(-50%,15px);padding:11px 18px;background:#e7a1c0;color:#23151d;border-radius:20px;font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;max-width:88%;text-align:center;box-shadow:0 9px 24px #0009}.toast.show{opacity:1;transform:translate(-50%,0)}.smallnote{font-size:10px;color:#938b9d;margin:7px 3px}.hidden{display:none!important}@media(max-height:760px){.bar{height:60px}.searcharea{padding-top:9px}.tabs{padding:6px 18px}.product{min-height:65px}.picture{width:51px;height:49px}.picture svg{width:41px;height:41px}.budgethead{padding:9px 13px}.budgetbody{padding-bottom:8px}.total strong{font-size:23px}}
@media(max-width:700px){body{overflow:hidden}.hint{display:none}.panel{width:100%;inset:0;border-radius:0;border:0;box-shadow:none}.bar{height:65px}}

.picture{appearance:none;border:0;cursor:pointer;padding:0;position:relative;isolation:isolate;background:linear-gradient(145deg,#43454c,#30353e);width:76px;height:65px;}
.picture:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.picture svg{position:absolute;width:151px;height:95px;max-width:none;max-height:none;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}
.picture:hover{filter:brightness(1.14)}

<body>
<div class="environment"></div>
<div class="hint"><small>SuyTools · prototipo</small><h1>Tu taller,<br>sin salir del juego.</h1><p>Vista previa funcional del diseño compacto.<br>En esta fase se abre en el navegador para probar los cálculos; después lo integraremos en el overlay de FiveM.</p></div>
<main class="panel" aria-label="Calculadora compacta del taller">
 <header class="bar"><div class="logo" id="toolLogo">t⁺</div><span class="brand" id="toolBrand">taller<i>.</i></span><div class="fill"></div><button class="iconbtn" type="button" id="help" title="Información">ⓘ</button><button class="iconbtn" type="button" id="reset" title="Limpiar presupuesto">↺</button></header>
 <nav class="toolmodes" id="toolModes" aria-label="Herramienta"></nav>
 <section class="searcharea" id="searchArea"><div class="searchbox"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg><input id="search" aria-label="Buscar producto" placeholder="Buscar producto..." autocomplete="off"/><span class="kbd">Ctrl K</span></div></section>
 <nav class="tabs" id="tabs" aria-label="Categorías principales"></nav>
 <nav class="filters" id="filters" aria-label="Filtros"></nav>
 <section class="products" id="products" aria-live="polite"></section>
 <section class="badu-mount" id="baduMount" hidden aria-label="Calculadora del Badulak"><iframe id="baduFrame" title="Calculadora Badulak" src="./badulake/index.html" loading="eager"></iframe></section>
 <section class="budget" id="budget"><button class="budgethead" id="budgetToggle" aria-expanded="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 4h3l3 13h12l2-10H6"/><circle cx="10" cy="21" r="1"/><circle cx="19" cy="21" r="1"/></svg><span>Tu presupuesto</span><span class="fill"></span><span class="countpill" id="basketQty">0</span><span class="minitotal" id="miniTotal">$0</span><span class="caret">⌃</span></button><div class="budgetbody">
  <div class="sumline"><span>Subtotal</span><span id="subtotal">$0</span></div>
  <div class="discount" id="discount" aria-label="Descuento"></div>
  <div class="total"><span>Total a cobrar</span><strong id="total">$0</strong></div>
  <div class="actions"><button class="main" id="copyTotal" type="button">⧉ Copiar total</button><button id="copyDetails" type="button">⧉ Copiar trabajo</button></div>
  <div class="detailsummary"><button class="tinybtn" id="showDetails">Ver detalle del trabajo ▾</button><button class="tinybtn" id="clear">Limpiar todo</button></div>
  <div class="details" id="details"><div class="detailopts"><span>Descripción del presupuesto</span><label><input type="checkbox" id="includeTotal"/> Incluir total</label></div><textarea id="detailsText" aria-label="Descripción del trabajo" placeholder="Aquí aparece el detalle..."></textarea></div>
 </div></section><div class="toast" id="toast" role="status"></div>
</main>

function spokes(cx,cy,r=30){return Array.from({length:5},(_,i)=>`<path d="M${cx-4} ${cy-5} ${cx-6} ${cy-r} ${cx+3} ${cy-r-2} ${cx+5} ${cy-6}z" fill="#b9bab1" transform="rotate(${i*72} ${cx} ${cy})"/>`).join('');}

 smoke:()=>`<g opacity=".7" fill="#f8ede0"><circle cx="146" cy="52" r="19"/><circle cx="171" cy="68" r="16"/><circle cx="154" cy="77" r="23"/><circle cx="130" cy="66" r="17"/></g><g transform="translate(-12 12) scale(.95)">${wheel()}</g><path d="M146 105c13-3 23-10 27-19m-20 29c12-1 24-8 29-15" fill="none" stroke="#b7807c" stroke-width="5" stroke-linecap="round" opacity=".45"/>`,
 engine:label=>`<g transform="rotate(-7 120 75)"><path d="m80 66 13-21h62l15 21-11 46H88z" fill="#809385"/><path d="m88 70 14-18h44l13 18-9 35H96z" fill="url(#steel)"/><path d="M100 67h47" stroke="#667969" stroke-width="6"/><path d="M110 42V30h24v12" fill="none" stroke="#aa9c80" stroke-width="8"/>${Array.from({length:label==='V12'?6:4},(_,i)=>`<path d="M${95+i*(label==='V12'?10:15)} 53v12" stroke="#c4b799" stroke-width="5"/>`).join('')}<rect x="101" y="78" width="45" height="23" rx="4" fill="#677a6d"/><text x="123.5" y="94" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#f3dfbe">${label}</text><path d="M82 82H71v19h19" fill="none" stroke="#748577" stroke-width="9"/><path d="M158 81h14v15h-16" fill="none" stroke="#718274" stroke-width="7"/></g>`,
 drive:label=>{const front=label!=='RWD',rear=label!=='FWD';return `<g transform="rotate(-8 120 72)"><path d="M93 47h53m-53 53h53m-26-53v53" stroke="#8d9d8b" stroke-width="7"/><rect x="109" y="64" width="23" height="20" rx="4" fill="#b9b79b"/>${[[83,34,front],[141,34,front],[83,87,rear],[141,87,rear]].map(([x,y,on])=>`<rect x="${x}" y="${y}" width="17" height="27" rx="6" fill="${on?'#b77155':'#6d786a'}"/><path d="M${x+4} ${y+7}h9m-9 6h9m-9 6h9" stroke="${on?'#e3b68d':'#9aa28f'}" stroke-width="1.6"/>`).join('')}<text x="120" y="127" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" letter-spacing="2" fill="#697661">${label}</text></g>`;},
 brakes:()=>`<g transform="rotate(-10 120 76)"><circle cx="115" cy="77" r="43" fill="#858d82"/><circle cx="115" cy="77" r="37" fill="url(#steel)"/><circle cx="115" cy="77" r="15" fill="#8c9a89"/><circle cx="115" cy="77" r="8" fill="#dbd8c0"/>${Array.from({length:12},(_,i)=>`<circle cx="115" cy="49" r="2.2" fill="#85937e" transform="rotate(${i*30} 115 77)"/>`).join('')}<rect x="146" y="49" width="20" height="56" rx="7" fill="url(#coral)"/><path d="M153 59v35" stroke="#e9ad82" stroke-width="2"/><path d="M88 55a34 34 0 0 1 33-12" fill="none" stroke="#ece9d2" stroke-width="2"/></g>`,
 turbo:()=>`<g transform="rotate(-9 120 73)"><path d="M101 45V30h26v22" fill="#879689"/><rect x="97" y="28" width="33" height="10" rx="3" fill="#c0c5b3"/><path d="M142 69h26v22h-33" fill="#8fa08f"/><rect x="163" y="66" width="9" height="28" rx="2" fill="#bfbea4"/><circle cx="112" cy="80" r="37" fill="url(#steel)"/><circle cx="112" cy="80" r="26" fill="#627969"/>${Array.from({length:7},(_,i)=>`<path d="m111 77-3-21 10 4 2 18z" fill="#b7c0a8" transform="rotate(${i*51.43} 112 80)"/>`).join('')}<circle cx="112" cy="80" r="7" fill="#d0b389"/></g>`,
 tire:label=>`<g transform="rotate(-9 120 76)">${wheel()}${label==='OFFROAD'?Array.from({length:12},(_,i)=>`<rect x="111" y="32" width="16" height="9" rx="2" fill="#5c695a" transform="rotate(${i*30} 119 76)"/>`).join(''):label==='SEMI'?Array.from({length:12},(_,i)=>`<path d="m118 38 6 5" stroke="#78806b" stroke-width="2" transform="rotate(${i*30} 119 76)"/>`).join(''):'<circle cx="119" cy="76" r="36" fill="none" stroke="#657062" stroke-width="1.2"/>'}<text x="119" y="128" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" letter-spacing="1.7" fill="#7c7c63">${label}</text></g>`,
 package:label=>`<g transform="rotate(-6 120 75)"><path d="M83 60V42h75v18" fill="#5c7464"/><path d="M90 45h61" stroke="#99aa90" stroke-width="3"/><path d="m75 58 92 5-5 52-79 7z" fill="url(#coral)"/><path d="m75 58 11-10 88 5-7 10z" fill="#dea57a"/><path d="m167 63 7-10-5 54-7 8z" fill="#9d6249"/><g transform="translate(88 72) scale(1.3)" fill="#f1d6ac">${wrench}</g><circle cx="137" cy="87" r="17" fill="#4f6356"/><circle cx="137" cy="87" r="11" fill="#b6bca2"/><circle cx="137" cy="87" r="5" fill="#687765"/><text x="122" y="113" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" letter-spacing="1.5" fill="#f3dbc1">FULL ${label}</text></g>`,
 nitro:label=>`<g transform="rotate(-9 118 75)"><rect x="111" y="21" width="16" height="16" rx="3" fill="#a49880"/><path d="M107 21h23" stroke="#78857b" stroke-width="5" stroke-linecap="round"/><path d="M101 48c0-14 35-14 35 0v62c0 10-35 10-35 0z" fill="url(#bottle)"/><ellipse cx="118.5" cy="110" rx="17.5" ry="6" fill="#648e88"/><rect x="103" y="66" width="31" height="27" rx="2" fill="#ede4c6"/><text x="118.5" y="84" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#547e78">N₂O</text><path d="M107 49v11" stroke="#b6d3c3" stroke-width="2"/></g>${label==='KIT'?'<path d="M133 33c34-3 41 68 24 79-6 4-12-2-11-7" fill="none" stroke="#6c7971" stroke-width="5" stroke-linecap="round"/><circle cx="160" cy="46" r="12" fill="#aab5a6"/><circle cx="160" cy="46" r="8" fill="#f0e4c4"/><path d="m160 46 4-5" stroke="#8c6b52" stroke-width="2"/>':''}`
};
function art(name,id,label=''){
 const defs='<defs><linearGradient id="steel" x2="1" y2="1"><stop stop-color="#e1dfcc"/><stop offset=".45" stop-color="#aebdad"/><stop offset="1" stop-color="#839481"/></linearGradient><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#d69673"/><stop offset="1" stop-color="#ad634c"/></linearGradient><linearGradient id="bottle" x2="1" y2="1"><stop stop-color="#8db4a9"/><stop offset="1" stop-color="#4f807c"/></linearGradient></defs>';
 const content=defs+'<ellipse cx="122" cy="132" rx="45" ry="5" fill="#665144" opacity=".1"/>'+(shapes[name]||shapes.repair)(label);
 return `<svg viewBox="0 0 240 150" aria-hidden="true">${content.replaceAll('id="','id="'+id+'-').replaceAll('url(#','url(#'+id+'-')}</svg>`;
}

const CATEGORY={basics:'Básicos',tuning:'Tuning',extras:'Extras'};
const GROUP={engines:'Motores',drive:'Tracciones',additions:'Adicionales',tires:'Llantas',packages:'Paquetes'};
const BASIC_GROUP={'repair':'Kits','paint':'Kits','performance':'Piezas','cosmetic':'Piezas','vehicle-extras':'Piezas','rims':'Rines','smoke':'Kits'};
const EXTRA_GROUP={'stance':'Suspensión','nitro':'Nitro','nitro-bottle':'Nitro'};
const CATALOG=ORIGINAL_PRODUCTS.map(p=>({...p,section:CATEGORY[p.category],group:p.category==='tuning'?GROUP[p.group]:(p.category==='basics'?BASIC_GROUP[p.id]:EXTRA_GROUP[p.id])}));

const key='suytools.taller.compacto.v1';
let state={tool:'taller',qty:{},discount:0,tab:'Tuning',filter:'Todos',search:'',detailsOpen:false,budgetOpen:true,includeTotal:false};
try{
 const old=window.suytools?.loadBudgetSync?.()||JSON.parse(localStorage.getItem(key)||'{}');
 const legacyMap={reparacion:'repair',pintura:'paint',rendimiento:'performance',cosmeticas:'cosmetic','extras-base':'vehicle-extras',rines:'rims',humo:'smoke',frenos:'brakes',fullv8:'full-v8',fullv12:'full-v12',botella:'nitro-bottle'};
 const qty={};
 for(const [id,value] of Object.entries(old.qty||{})){const correct=legacyMap[id]||id;if(CATALOG.some(p=>p.id===correct))qty[correct]=Math.max(0,Math.min(99,Number(value)||0))}
 state={...state,...old,qty};
}catch{}
const $=s=>document.querySelector(s);const money=n=>'$'+Math.max(0,n).toLocaleString('es-MX',{maximumFractionDigits:2});const sanitize=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const store=()=>{try{localStorage.setItem(key,JSON.stringify(state))}catch{}try{window.suytools?.saveBudget?.(state)}catch{}};
let noticeHandle=null;
function notify(s){const t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(noticeHandle);noticeHandle=setTimeout(()=>t.classList.remove('show'),1800)}

function selectedItems(){return CATALOG.filter(p=>(state.qty[p.id]||0)>0)}
function getSubtotal(){return selectedItems().reduce((sum,p)=>sum+p.price*(state.qty[p.id]||0),0)}
function jobText(){const rows=selectedItems().map(p=>`${p.name} ×${state.qty[p.id]} — ${money(p.price*state.qty[p.id])}`);if(!rows.length)return '';if(state.includeTotal)rows.push(`Total (${state.discount}% dto.): ${money(Math.round(getSubtotal()*(100-state.discount)/100))}`);return rows.join('\n')}
function renderToolModes(){const tools=[['taller','Taller'],['badu','Badulake']];$('#toolModes').innerHTML=tools.map(([id,label])=>`<button class="toolmode ${state.tool===id?'current':''}" data-tool="${id}" aria-pressed="${state.tool===id}">${label}</button>`).join('');$('#toolLogo').textContent=state.tool==='taller'?'t⁺':'b⁺';$('#toolBrand').innerHTML=state.tool==='taller'?'taller<i>.</i>':'badulak<i>.</i>';$('#toolBrand').style.fontSize=state.tool==='taller'?'23px':'20px';}
function renderNav(){const tabs=['Todo','Básicos','Tuning','Extras'];$('#tabs').innerHTML=tabs.map(t=>`<button class="tab ${state.tab===t?'current':''}" data-tab="${t}" aria-pressed="${state.tab===t}">${t}</button>`).join('');const pool=CATALOG.filter(p=>state.tab==='Todo'||p.section===state.tab);const groups=['Todos',...new Set(pool.map(p=>p.group))];if(!groups.includes(state.filter))state.filter='Todos';$('#filters').innerHTML=groups.map(g=>`<button class="chip ${state.filter===g?'active':''}" data-filter="${g}" aria-pressed="${state.filter===g}">${g}</button>`).join('')}
function renderProducts(){if(state.tool!=='taller')return;const pool=CATALOG.filter(p=>(state.tab==='Todo'||p.section===state.tab)&&(state.filter==='Todos'||p.group===state.filter)&&p.name.toLocaleLowerCase('es-MX').includes(state.search.trim().toLocaleLowerCase('es-MX')));$('#products').innerHTML=pool.map(p=>`<article class="product"><button type="button" class="picture" data-step="1" data-id="${p.id}" title="Agregar ${sanitize(p.name)}" aria-label="Agregar ${sanitize(p.name)}">${art(p.art,p.id,p.label||'')}</button><div class="info"><div class="productname" title="${sanitize(p.name)}">${sanitize(p.name)}</div><div class="price">${money(p.price)}</div></div><div class="counter"><button data-step="-1" data-id="${p.id}" aria-label="Restar ${sanitize(p.name)}">−</button><span class="count" data-count="${p.id}">${state.qty[p.id]||0}</span><button class="plus" data-step="1" data-id="${p.id}" aria-label="Sumar ${sanitize(p.name)}">+</button></div></article>`).join('')||'<div class="empty">No encontré productos con ese filtro ♡</div>'}
function renderBudget(){const hidden=state.tool!=='taller';$('#searchArea').classList.toggle('hidden',hidden);$('#tabs').classList.toggle('hidden',hidden);$('#filters').classList.toggle('hidden',hidden);$('#products').classList.toggle('hidden',hidden);$('#budget').classList.toggle('hidden',hidden);$('#baduMount').hidden=!hidden;$('#reset').classList.toggle('hidden',hidden);document.body.dataset.tool=state.tool;window.dispatchEvent(new CustomEvent('suy:toolChanged',{detail:{tool:state.tool}}));if(hidden)return;const sub=getSubtotal(),total=Math.round(sub*(100-state.discount)/100),units=Object.values(state.qty).reduce((s,n)=>s+Number(n||0),0);$('#basketQty').textContent=units;$('#miniTotal').textContent=money(total);$('#subtotal').textContent=money(sub);$('#total').textContent=money(total);$('#discount').innerHTML=[0,5,10,15].map(d=>`<button data-discount="${d}" class="${d===state.discount?'on':''}" aria-pressed="${d===state.discount}">${d===0?'Sin dto.':d+'%'}</button>`).join('');$('#detailsText').value=jobText();$('#details').classList.toggle('visible',state.detailsOpen);$('#showDetails').textContent=state.detailsOpen?'Ocultar detalle ▴':'Ver detalle del trabajo ▾';$('#budget').classList.toggle('closed',!state.budgetOpen);$('#budgetToggle').setAttribute('aria-expanded',String(state.budgetOpen));$('#includeTotal').checked=!!state.includeTotal}
function renderAll(){renderToolModes();renderNav();renderProducts();renderBudget();store()}
$('#toolModes').addEventListener('click',e=>{const b=e.target.closest('[data-tool]');if(!b)return;state.tool=b.dataset.tool;renderAll();$('#products').scrollTop=0});
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b||state.tool!=='taller')return;state.tab=b.dataset.tab;state.filter='Todos';renderAll();$('#products').scrollTop=0});
$('#filters').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;state.filter=b.dataset.filter;renderAll();$('#products').scrollTop=0});
$('#products').addEventListener('click',e=>{const b=e.target.closest('[data-step]');if(!b||state.tool!=='taller')return;const id=b.dataset.id;state.qty[id]=Math.max(0,Math.min(99,(Number(state.qty[id])||0)+Number(b.dataset.step)));renderProducts();renderBudget();store()});
$('#discount').addEventListener('click',e=>{const b=e.target.closest('[data-discount]');if(!b)return;state.discount=Number(b.dataset.discount);renderBudget();store()});
$('#search').addEventListener('input',e=>{state.search=e.target.value;renderProducts();store()});$('#search').value=state.search;
$('#budgetToggle').addEventListener('click',()=>{state.budgetOpen=!state.budgetOpen;renderBudget();store()});
$('#showDetails').addEventListener('click',()=>{state.detailsOpen=!state.detailsOpen;renderBudget();store()});
$('#includeTotal').addEventListener('change',e=>{state.includeTotal=e.target.checked;renderBudget();store()});
$('#clear').addEventListener('click',()=>{if(!selectedItems().length)return; if(confirm('¿Limpiar los productos y el presupuesto?')){state.qty={};state.discount=0;renderAll();notify('Presupuesto limpio')}});
$('#reset').addEventListener('click',()=>$('#clear').click());
$('#help').addEventListener('click',()=>notify('SuyTools Taller · Modo compacto'));
async function copy(text){if(!text){notify('Primero agrega un producto');return}try{if(window.suytools?.copyText){await window.suytools.copyText(text)}else{await navigator.clipboard.writeText(text)}notify('Copiado al portapapeles ♡')}catch{const x=document.createElement('textarea');x.value=text;document.body.appendChild(x);x.select();const ok=document.execCommand('copy');x.remove();notify(ok?'Copiado al portapapeles ♡':'No se pudo copiar')}}
$('#copyTotal').addEventListener('click',()=>copy(String(Math.round(getSubtotal()*(100-state.discount)/100))));
$('#copyDetails').addEventListener('click',()=>copy($('#detailsText').value||jobText()));
$('#detailsText').addEventListener('input',()=>{});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#search').focus();$('#search').select()}});
renderAll();
// Interface segura para importar una orden: no reemplaza datos sin confirmación.
window.suyCaptureBridge=Object.freeze({
  products:()=>CATALOG.map(p=>({id:p.id,name:p.name,price:p.price})),
  quantities:()=>({...state.qty}),
  discount:()=>state.discount,
  apply:quantities=>{
    const validIds=new Set(CATALOG.map(p=>p.id));
    const next={};
    for(const [id,q] of Object.entries(quantities)){
      const n=Number(q);
      if(validIds.has(id)&&Number.isInteger(n)&&n>=0&&n<=99)next[id]=n;
    }
    state.qty=next;renderAll();
  },
  toast:notify
});
</script>
<script src="theme-picker.js"></script>
<script src="overlay-ui.js"></script>
<script type="module" src="capture-ui.js"></script>
</body>
</html>
