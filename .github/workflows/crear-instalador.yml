name: Actualizar SuyTools (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dar numero unico a esta version
        run: node scripts/version-ci.js
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Crear instalador y archivo de actualizaciones
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publicar nueva version para la app
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $files = @(Get-ChildItem 'dist' -Filter 'SuyTools-Taller-Setup-*.exe' | ForEach-Object { $_.FullName })
          $files += @(Get-ChildItem 'dist' -Filter '*.blockmap' | ForEach-Object { $_.FullName })
          $manifest = Join-Path (Get-Location) 'dist/latest.yml'
          if (-not (Test-Path $manifest) -or $files.Count -lt 1) { throw 'Falta instalador o latest.yml' }
          $files += $manifest
          gh release create $tag @files --target $env:GITHUB_SHA --title "SuyTools Taller $tag" --notes 'Actualizacion automatica de SuyTools Taller.' --latest
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo publicar la version en GitHub Releases' }
      - name: Copia descargable en Actions
        uses: actions/upload-artifact@v4
        with:
          name: SuyTools-Taller-Windows
          path: dist/SuyTools-Taller-Setup-*.exe
          if-no-files-found: error
